# Uma tag x.y.z igual à "version" do manifest.json publica o tema do Obsidian.
# Tags de outros aplicativos usam prefixo (zed-1.0.0, vscode-1.0.0) e não passam por aqui.
name: Release Obsidian theme

on:
  push:
    tags:
      - "[0-9]+.[0-9]+.[0-9]+"

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Check that the tag matches manifest.json
        run: |
          tag="${GITHUB_REF#refs/tags/}"
          version="$(jq -r .version manifest.json)"
          if [ "$tag" != "$version" ]; then
            echo "tag $tag differs from manifest version $version" >&2
            exit 1
          fi

      - name: Create release
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          tag="${GITHUB_REF#refs/tags/}"
          gh release create "$tag" \
            --title "Obsidian $tag" \
            --generate-notes \
            manifest.json obsidian/theme.css
